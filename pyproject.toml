[project]
name = "ba-thermal-plume"
version = "1.0.0"
description = "Machine learning models for thermal plume prediction (Bachelor Thesis)"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "optuna",
    "pandas",
    "psutil",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "tensorboard",
    "torch",
    "torchinfo",
]

[project.scripts]
ba-predict = "scripts.predict:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "optuna-dashboard"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = """
    -v
    --tb=short
    --strict-markers
    --disable-warnings
"""
markers = [
    "fast: marks a fast smoke/unit test subset",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "preserve"

[tool.coverage.run]
source = ["."]
omit = [
    "test_*.py",
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
